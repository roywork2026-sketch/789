var X2={"en": {"m2": ["Feeling low or unsafe", "About 789"], "listen": "Listen", "sup": "If you are in danger, call 999. If you feel unsafe, very low, or want to hurt yourself, you are not alone. In England call 111 and choose the mental health option. Samaritans: 116 123, free, 24 hours. Shout: text SHOUT to 85258, free, 24 hours. Anyone can call for you.", "ab": ["789 is a small independent service that helps people who are new to the UK, and adults going through a hard time, find clear and free information. It is not part of, or funded by, the UK government, the NHS or the Home Office.", "We give general information only, not legal or medical advice. We never ask for your name, status or documents, we show no adverts, and we do not sell data. Our aim is to have every translation and guide checked by native speakers and regulated advisers. Contact: [CONTACT]"]}, "ar": {"m2": ["أشعر بالحزن أو عدم الأمان", "عن 789"], "listen": "استماع", "sup": "إذا كنت في خطر فاتصل بالرقم 999. إذا شعرت بعدم الأمان أو بحزن شديد أو برغبة في إيذاء نفسك فأنت لست وحدك. في إنجلترا اتصل بالرقم 111 واختر خيار الصحة النفسية. Samaritans: 116 123 مجاناً على مدار الساعة. Shout: أرسل رسالة SHOUT إلى 85258 مجاناً على مدار الساعة. يمكن لأي شخص الاتصال نيابة عنك.", "ab": ["789 خدمة مستقلة صغيرة تساعد القادمين الجدد إلى المملكة المتحدة والبالغين الذين يمرون بوقت صعب على إيجاد معلومات واضحة ومجانية. ليست جزءاً من الحكومة البريطانية أو هيئة الخدمات الصحية أو وزارة الداخلية ولا تمولها.", "نقدم معلومات عامة فقط، لا نصيحة قانونية أو طبية. لا نطلب اسمك أو وضعك أو وثائقك، ولا نعرض إعلانات، ولا نبيع البيانات. هدفنا أن يراجع متحدثون أصليون ومستشارون مسجّلون كل ترجمة ودليل. للتواصل: [CONTACT]"]}, "uk": {"m2": ["Мені погано або небезпечно", "Про 789"], "listen": "Слухати", "sup": "Якщо ви в небезпеці, телефонуйте 999. Якщо ви почуваєтеся в небезпеці, дуже пригнічено або хочете завдати собі шкоди, ви не самі. В Англії телефонуйте 111 і оберіть психічне здоров’я. Samaritans: 116 123, безкоштовно, цілодобово. Sho
